name: Bug Report
description: Report a bug or unexpected behavior in Millager
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below as completely as possible.

  - type: input
    id: mod-version
    attributes:
      label: Millager Version
      description: Found in the `.jar` filename in your mods folder (e.g. `millager-1.0.0+1.21.1.jar`)
      placeholder: e.g. 1.0.0+1.21.1
    validations:
      required: true

  - type: input
    id: mc-version
    attributes:
      label: Minecraft Version
      placeholder: e.g. 1.21.1
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Mod Loader
      options:
        - Fabric
        - Forge
        - NeoForge
        - Quilt
        - Other
    validations:
      required: true

  - type: input
    id: loader-version
    attributes:
      label: Loader Version
      description: Fabric Loader / Forge version
      placeholder: e.g. Fabric Loader 0.16.10
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect to happen?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: crash-report
    attributes:
      label: Crash Report / Log
      description: |
        Paste the crash report or relevant log here, or link to a paste (e.g. https://mclo.gs).
        Logs are located in `.minecraft/logs/` or `.minecraft/crash-reports/`.
      render: text
    validations:
      required: false

  - type: textarea
    id: other-mods
    attributes:
      label: Other Mods Installed
      description: List any other mods that may be relevant, or paste your full mod list.
      placeholder: |
        - Fabric API 0.x.x
        - ...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, videos, or any other information that might help.
    validations:
      required: false
